{% extends "base.html" %}
{% block title %}Register — AgriSmart AI{% endblock %}
{% block footer %}{% endblock %}
{% block body %}
<div class="auth-container" style="padding-top:7rem;">
    <div class="auth-card card" style="max-width:480px;">
        <div class="auth-logo">
            <div class="logo-icon">🌿</div>
            <h1 class="auth-title">Create Your Account</h1>
            <p class="auth-sub">Join AgriSmart and start protecting your crops</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Full Name / Username *</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="e.g. Ramesh Kumar" required
                           value="{{ request.form.get('username', '') }}">
                </div>
                <div class="form-group">
                    <label class="form-label">City *</label>
                    <input type="text" name="city" class="form-control"
                           placeholder="e.g. Ludhiana" required
                           value="{{ request.form.get('city', '') }}">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address *</label>
                <input type="email" name="email" class="form-control"
                       placeholder="you@example.com" required
                       value="{{ request.form.get('email', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label">Farm Name (optional)</label>
                <input type="text" name="farm_name" class="form-control"
                       placeholder="e.g. Green Valley Farm"
                       value="{{ request.form.get('farm_name', '') }}">
            </div>
            <div class="form-group">
                <label class="form-label">Password *</label>
                <div class="input-group">
                    <input type="password" name="password" id="pwd1"
                           class="form-control" placeholder="Min. 6 characters" required>
                    <span class="input-group-icon" onclick="togglePwd('pwd1', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Confirm Password *</label>
                <div class="input-group">
                    <input type="password" name="confirm_password" id="pwd2"
                           class="form-control" placeholder="Re-enter password" required>
                    <span class="input-group-icon" onclick="togglePwd('pwd2', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="divider"></div>
        <p style="text-align:center;font-size:0.88rem;color:var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" style="color:var(--primary-light);font-weight:600;">Sign in</a>
        </p>
    </div>
</div>

<script>
function togglePwd(fieldId, icon) {
    const f = document.getElementById(fieldId);
    const i = icon.querySelector('i');
    if (f.type === 'password') {
        f.type = 'text';
        i.className = 'fas fa-eye-slash';
    } else {
        f.type = 'password';
        i.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
