{% extends "base.html" %}
{% block title %}Forgot Password — AgriSmart AI{% endblock %}
{% block footer %}{% endblock %}
{% block body %}
<div class="auth-container">
    <div class="auth-card card">
        <div class="auth-logo">
            <div class="logo-icon">🔑</div>
            <h1 class="auth-title">Reset Password</h1>
            <p class="auth-sub">Enter your email and we'll send a reset link</p>
        </div>
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <div class="divider"></div>
        <p style="text-align:center;font-size:0.88rem;color:var(--text-muted);">
            <a href="{{ url_for('auth.login') }}" style="color:var(--primary-light);">← Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
