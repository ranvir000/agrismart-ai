{% extends "base.html" %}
{% block title %}Page Not Found — AgriSmart AI{% endblock %}
{% block body %}
<div style="padding:140px 1rem 4rem;text-align:center;min-height:80vh;">
    <div style="font-size:4rem;margin-bottom:1rem;">🌾</div>
    <h1 style="font-size:2.5rem;margin-bottom:1rem;">404 - Page Not Found</h1>
    <p style="color:var(--text-muted);max-width:500px;margin:0 auto 2rem;">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
