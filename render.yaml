databases:
  - name: agrismart-db
    plan: free
    databaseName: agrismart
    user: agrismart

services:
  - type: web
    name: agrismart-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: agrismart-db
          property: connectionString
      - key: WEATHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@agrismart.com
      - key: ADMIN_PASSWORD
        sync: false
